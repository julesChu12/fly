# 开发环境配置
input {
  # 从 Docker 容器日志收集
  tcp {
    port => 5000
    codec => json
    tags => ["docker"]
  }

  # 文件日志收集
  file {
    path => "/var/log/fly-crm/*.log"
    start_position => "beginning"
    tags => ["file"]
  }
}

filter {
  # JSON 解析
  if [message] =~ /^\{/ {
    json {
      source => "message"
    }
  }

  # 时间戳处理
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # 服务标签提取
  grok {
    match => {
      "message" => "%{GREEDYDATA:service}.*level=%{LOGLEVEL:level}"
    }
  }

  # 添加环境标签
  mutate {
    add_field => {
      "environment" => "development"
      "cluster" => "fly-crm"
    }
  }
}

output {
  # 输出到 Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "logs-%{+YYYY.MM.dd}"
    manage_template => true
    template_name => "logs"
    template => "/etc/logstash/templates/logs-template.json"
    template_overwrite => true
  }

  # 控制台输出用于调试
  stdout {
    codec => rubydebug
  }
}
