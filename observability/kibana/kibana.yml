servers:
  - name: production
    url: http://elasticsearch:9200
    maxFieldsFromMapping: 10000

elasticsearch:
  hosts:
    - http://elasticsearch:9200

kibana:
  defaultAppId: "discover"
  index: "logs-*"
  defaultIndex: "logs-*"

# 日志视图配置
logging:
  verbose: false
  quiet: false

# 高级设置
xpack:
  security:
    enabled: false
  monitoring:
    enabled: false

# UI 自定义
uiSettings:
  "defaultIndex":
    description: "默认索引"
    value: "logs-*"

  "dateFormat":
    description: "日期格式"
    value: "YYYY-MM-DD HH:mm:ss"

  "discover:sampleSize":
    description: "发现页面样本大小"
    value: 500

  "metrics:max_buckets":
    description: "最大桶数"
    value: 2000

  "state:storeInSessionStorage":
    description: "在会话存储中存储状态"
    value: false

  "courier:maxSegmentCount":
    description: "最大段数"
    value: 30
