global:
  resolve_timeout: 5m
  # SMTP 邮件通知配置
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_auth_username: 'your-email@gmail.com'
  smtp_auth_password: 'your-app-password'
  smtp_from: 'alerts@fly-crm.local'

# 告警通知模板
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# 告警分组、分组等待、重复间隔等选项
route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # 严重告警立即通知
    - match:
        severity: critical
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 1h

    # 警告告警
    - match:
        severity: warning
      receiver: 'warning'
      group_wait: 1m
      repeat_interval: 4h

    # 信息告警
    - match:
        severity: info
      receiver: 'default'
      group_wait: 5m
      repeat_interval: 8h

# 告警接收器
receivers:
  - name: 'default'
    email_configs:
      - to: 'admin@fly-crm.local'
        headers:
          Subject: '[告警] {{ .GroupLabels.alertname }}'

  - name: 'critical'
    email_configs:
      - to: 'admin@fly-crm.local'
        headers:
          Subject: '[严重告警] {{ .GroupLabels.alertname }}'
    # 也可以配置钉钉、企业微信等
    # webhook_configs:
    #   - url: 'http://webhook-receiver:5000/alerts'

  - name: 'warning'
    email_configs:
      - to: 'operations@fly-crm.local'
        headers:
          Subject: '[警告] {{ .GroupLabels.alertname }}'

# 告警抑制规则
inhibit_rules:
  # 如果有更严重的告警，抑制较轻的告警
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # 如果服务已宕机，抑制其他相关告警
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'High.*Rate|HighResponseTime'
    equal: ['service']
