# Hermes Service Configuration
# 客户服务配置文件

# 服务器配置
server:
  name: "hermes"
  version: "1.0.0"
  http_port: 8080
  grpc_port: 9080
  shutdown_timeout: 30s

# 数据库配置
# 可通过环境变量 DATABASE_URL 覆盖
database:
  driver: "mysql"
  host: "mysql"
  port: "3306"
  username: "hermes"
  password: "hermespassword"
  database: "hermes"
  charset: "utf8mb4"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 3600  # seconds
  log_level: "warn"

# 缓存配置
cache:
  driver: "redis"
  address: "redis:6379"
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

# 日志配置
logger:
  level: "info"
  format: "json"
  output_path: "logs/hermes.log"
  max_size: 100
  max_backups: 10
  max_age: 30
  compress: false
  enable_stdout: true
  enable_file: false

# 可观测性配置
observability:
  # 分布式链路追踪
  tracing:
    enabled: true
    endpoint: "http://jaeger:4317"
    service_name: "hermes"
    service_version: "1.0.0"
    sample_ratio: 0.1

  # 指标收集
  metrics:
    enabled: true
    port: 9090
    path: "/metrics"

  # 健康检查
  health:
    enabled: true
    port: 8081
    path: "/health"

# DTM分布式事务配置
dtm:
  server: "localhost:36790"
  timeout: 30s
  retry_interval: 1s
  request_timeout: 3s

# 限流配置
rate_limit:
  enabled: true
  requests_per_second: 1000
  burst: 2000

# 认证配置
auth:
  jwt_secret: "your-jwt-secret-key"
  token_expire: 3600s
  custos_endpoint: "localhost:8081"