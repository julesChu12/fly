# Appointments Service Configuration

server:
  http_port: 8083
  grpc_port: 9083

database:
  driver: mysql
  host: localhost
  port: "3306"
  username: root
  password: rootpassword
  database: appointments
  charset: utf8mb4
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 3600  # seconds
  log_level: warn

logger:
  level: info
  format: json
  output_path: logs/appointments.log
  max_size: 100      # MB
  max_backups: 10
  max_age: 30        # days
  compress: true
  enable_stdout: true
  enable_file: true