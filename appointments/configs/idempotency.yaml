# 幂等性配置
idempotency:
  # Redis配置
  redis:
    addr: "localhost:6379"
    password: ""
    db: 1

  # 幂等性管理器配置
  manager:
    prefix: "idempotency:"
    default_ttl: 24h          # 默认TTL
    max_ttl: 168h              # 最大TTL (7天)
    cleanup_interval: 1h       # 清理间隔
    enable_stats: true         # 是否启用统计

  # HTTP中间件配置
  middleware:
    required_methods: ["POST", "PUT", "PATCH", "DELETE"]
    idempotency_key_header: "X-Idempotency-Key"
    default_ttl: 24h
    max_ttl: 168h
    log_request_body: false     # 生产环境建议设为false

  # 服务层配置
  service:
    default_ttl: 24h
    enable_cache: true
    enable_retry: true
    max_retry_count: 3
    retry_delay: 1s