version: '3.8'

services:
  # Appointments Service
  appointments:
    build:
      context: ..
      dockerfile: appointments/Dockerfile
      target: ${BUILD_TARGET:-dev}
      args:
        GO_VERSION: ${GO_VERSION:-1.25.1}
        BUILD_OS: ${BUILD_OS:-linux}
        BUILD_ARCH: ${BUILD_ARCH:-amd64}
    image: ${DOCKER_IMAGE_NAME:-appointments-service}:${DOCKER_TAG:-dev}
    container_name: appointments-${APP_ENV:-dev}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-appointments-service}
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-18083}
      GRPC_PORT: ${GRPC_PORT:-15083}
      CONFIG_PATH: /app/configs/appointments.yaml
      GIN_MODE: ${GIN_MODE:-debug}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Override DB settings for Docker environment
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:-fly_user}
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_DATABASE: ${DB_DATABASE:-appointments_dev}
      DB_CHARSET: utf8mb4
      DB_PARSE_TIME: true
      DB_LOC: Local
      DB_MAX_IDLE_CONNS: 10
      DB_MAX_OPEN_CONNS: 100
      DB_CONN_MAX_LIFETIME: 3600
      # Redis settings for Docker
      REDIS_ADDRESS: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-2}
      REDIS_POOL_SIZE: 10
      REDIS_MIN_IDLE_CONNS: 5
      # External services
      CUSTOS_GRPC_ADDRESS: ${CUSTOS_GRPC_ADDRESS:-custos:9001}
      KRATOS_GRPC_ADDRESS: ${KRATOS_GRPC_ADDRESS:-kratos:9092}
      PLUTUS_GRPC_ADDRESS: ${PLUTUS_GRPC_ADDRESS:-plutus:9085}
      STAFF_GRPC_ADDRESS: ${STAFF_GRPC_ADDRESS:-staff:9090}
      # Observability
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-appointments}
      OTEL_EXPORTER_URL: ${OTEL_EXPORTER_URL:-http://jaeger:4317}
      OTEL_SAMPLE_RATIO: ${OTEL_SAMPLE_RATIO:-1.0}
      OTEL_ENVIRONMENT: ${OTEL_ENVIRONMENT:-development}
      # Order integration
      ORDER_INTEGRATION_ENABLED: ${ORDER_INTEGRATION_ENABLED:-true}
      AUTO_PAYMENT_ENABLED: ${AUTO_PAYMENT_ENABLED:-true}
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
      - ./data:/app/data
    ports:
      - "${SERVER_PORT:-18083}:${SERVER_PORT:-18083}"
      - "${GRPC_PORT:-15083}:${GRPC_PORT:-15083}"
    networks:
      - fly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:18083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fly-mysql-${APP_ENV:-dev}
    command: |
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-appointments_dev}
      MYSQL_USER: ${DB_USERNAME:-fly_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rootpassword}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../scripts/mysql:/docker-entrypoint-initdb.d:ro
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - fly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: fly-redis-${APP_ENV:-dev}
    command: |
      sh -c 'if [ -n "${REDIS_PASSWORD}" ]; then
        redis-server --requirepass ${REDIS_PASSWORD};
      else
        redis-server;
      fi'
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - fly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Production environment variables (set via APP_ENV=production)
# Use APP_ENV=production docker-compose up for production deployment

networks:
  fly-network:
    driver: bridge
    name: fly-${APP_ENV:-dev}-network

volumes:
  mysql_data:
    name: mysql-${APP_ENV:-dev}_data
  redis_data:
    name: redis-${APP_ENV:-dev}_data