basePath: /api/v1
definitions:
  handler.HealthResponse:
    properties:
      service:
        type: string
      status:
        type: string
      timestamp:
        type: string
      version:
        type: string
    type: object
host: localhost:8086
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 统一商品管理服务 API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Items Service API
  version: "1.0"
paths:
  /categories:
    get:
      consumes:
      - application/json
      description: Get a list of categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Create a new category
      parameters:
      - description: Category data
        in: body
        name: category
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Create category
      tags:
      - Categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a category by its ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      summary: Delete category
      tags:
      - Categories
    get:
      consumes:
      - application/json
      description: Get a category by its ID
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      summary: Get category by ID
      tags:
      - Categories
    put:
      consumes:
      - application/json
      description: Update an existing category
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated category data
        in: body
        name: category
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      summary: Update category
      tags:
      - Categories
  /categories/tree:
    get:
      consumes:
      - application/json
      description: Get hierarchical category tree
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get category tree
      tags:
      - Categories
  /health:
    get:
      consumes:
      - application/json
      description: Checks if the service is healthy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: Health check
      tags:
      - Health
  /items:
    get:
      consumes:
      - application/json
      description: Get a list of items with pagination and filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Item type (SERVICE|PRODUCT)
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get items
      tags:
      - Items
    post:
      consumes:
      - application/json
      description: Create a new item
      parameters:
      - description: Item data
        in: body
        name: item
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
      summary: Create item
      tags:
      - Items
  /items/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an item by its ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      summary: Delete item
      tags:
      - Items
    get:
      consumes:
      - application/json
      description: Get an item by its ID
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      summary: Get item by ID
      tags:
      - Items
    put:
      consumes:
      - application/json
      description: Update an existing item
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated item data
        in: body
        name: item
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      summary: Update item
      tags:
      - Items
  /items/{id}/status:
    patch:
      consumes:
      - application/json
      description: Update the status of an item
      parameters:
      - description: Item ID
        in: path
        name: id
        required: true
        type: string
      - description: Status data
        in: body
        name: status
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
      summary: Update item status
      tags:
      - Items
  /search/items:
    get:
      consumes:
      - application/json
      description: Search for items with various filters
      parameters:
      - description: Search query
        in: query
        name: q
        type: string
      - description: Item type filter
        in: query
        name: type
        type: string
      - description: Category ID filter
        in: query
        name: category_id
        type: integer
      - description: Minimum price filter
        format: float64
        in: query
        name: min_price
        type: number
      - description: Maximum price filter
        format: float64
        in: query
        name: max_price
        type: number
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Search items
      tags:
      - Search
  /stats/items:
    get:
      consumes:
      - application/json
      description: Get detailed statistics for items
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get item statistics
      tags:
      - Statistics
  /stats/overview:
    get:
      consumes:
      - application/json
      description: Get overview statistics for items and categories
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      summary: Get overview statistics
      tags:
      - Statistics
securityDefinitions:
  ApiKeyAuth:
    description: Bearer token for authentication
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
