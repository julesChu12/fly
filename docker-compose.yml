# Fly Platform - Docker Compose Configuration
# 统一的生产环境容器编排配置
version: '3.8'

services:
  # ========================================
  # Infrastructure Services
  # ========================================

  mysql:
    image: mysql:8.0
    container_name: fly-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: custos
      MYSQL_USER: custos
      MYSQL_PASSWORD: custospassword
      MYSQL_ROOT_HOST: "%"
    volumes:
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s
    networks:
      - fly-network

  redis:
    image: redis:7-alpine
    container_name: fly-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fly-network

  # ========================================
  # Business Services
  # ========================================

  # Custos - 认证授权服务
  custos:
    build:
      context: .
      dockerfile: custos/Dockerfile.prod
    container_name: fly-custos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8081:8081"  # HTTP
      - "9001:9001"  # gRPC
    volumes:
      - ./custos/configs:/app/configs
    environment:
      # Custos 环境变量使用 CUSTOS_ 前缀
      CONFIG_PATH: /app/configs/custos.yaml
      CUSTOS_APP_PORT: "8081"
      CUSTOS_DB_HOST: mysql
      CUSTOS_DB_PORT: "3306"
      CUSTOS_DB_USER: custos
      CUSTOS_DB_PASSWORD: custospassword
      CUSTOS_DB_DATABASE: custos
      REDIS_ADDR: redis:6379
      CUSTOS_LOG_LEVEL: info
      CUSTOS_LOG_FORMAT: json
      CUSTOS_LOG_ENABLE_STDOUT: "true"
      CUSTOS_LOG_ENABLE_FILE: "false"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network

  # Hermes - 客户管理服务
  hermes:
    build:
      context: .
      dockerfile: hermes/Dockerfile.prod
    container_name: fly-hermes
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8083:8083"  # HTTP (修正为8083)
      - "9080:9080"  # gRPC
    volumes:
      - ./hermes/configs:/app/configs
    environment:
      # Hermes 环境变量使用 HERMES_ 前缀
      HERMES_SERVER_HTTP_PORT: 8083
      HERMES_SERVER_GRPC_PORT: 9080
      HERMES_DATABASE_HOST: mysql
      HERMES_DATABASE_PORT: "3306"
      HERMES_DATABASE_USERNAME: hermes
      HERMES_DATABASE_PASSWORD: hermespassword
      HERMES_DATABASE_DATABASE: hermes
      REDIS_URL: redis:6379
      HERMES_LOGGER_LEVEL: info
      HERMES_LOGGER_ENABLE_STDOUT: "true"
      HERMES_LOGGER_ENABLE_FILE: "false"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network

  # Kratos - 订单服务
  kratos:
    build:
      context: .
      dockerfile: kratos/Dockerfile.prod
    container_name: fly-kratos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8084:8084"  # HTTP (修正为8084)
      - "9092:9092"  # gRPC
    volumes:
      - ./kratos/configs:/app/configs
    environment:
      # Kratos 环境变量使用 KRATOS_ 前缀
      KRATOS_SERVER_HTTP_PORT: 8084
      KRATOS_SERVER_GRPC_PORT: 9092
      KRATOS_DATABASE_DRIVER: mysql
      KRATOS_DATABASE_DSN: kratos:kratospassword@tcp(mysql:3306)/kratos?charset=utf8mb4&parseTime=True&loc=Local
      KRATOS_CACHE_ADDRESS: redis:6379
      KRATOS_LOGGER_LEVEL: info
      KRATOS_LOGGER_ENABLE_STDOUT: "true"
      KRATOS_LOGGER_ENABLE_FILE: "false"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network

  # Plutus - 支付钱包服务
  plutus:
    build:
      context: .
      dockerfile: plutus/Dockerfile.prod
    container_name: fly-plutus
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8085:8085"  # HTTP
      - "9085:9085"  # gRPC
    volumes:
      - ./plutus/configs:/app/configs
    environment:
      # Plutus 环境变量使用 PLUTUS_ 前缀
      PLUTUS_SERVER_HTTP_PORT: 8085
      PLUTUS_SERVER_GRPC_PORT: 9085
      PLUTUS_DATABASE_DRIVER: mysql
      PLUTUS_DATABASE_DSN: plutus:plutuspassword@tcp(mysql:3306)/plutus?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      PLUTUS_LOGGER_LEVEL: info
      PLUTUS_LOGGER_ENABLE_STDOUT: "true"
      PLUTUS_LOGGER_ENABLE_FILE: "false"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network

  # Clotho - API 网关编排层
  clotho:
    build:
      context: .
      dockerfile: clotho/Dockerfile.prod
    container_name: fly-clotho
    restart: unless-stopped
    depends_on:
      custos:
        condition: service_healthy
      hermes:
        condition: service_healthy
      kratos:
        condition: service_healthy
      plutus:
        condition: service_healthy
    ports:
      - "8080:8080"  # HTTP
    volumes:
      - ./clotho/configs:/app/configs
    environment:
      # Clotho 环境变量使用 CLOTHO_ 前缀
      CONFIG_PATH: /app/configs/clotho.yaml
      CLOTHO_SERVER_PORT: "8080"
      CLOTHO_APP_MODE: production
      CLOTHO_JWT_SECRET: "production-secret-key-change-this"
      CLOTHO_LOGGING_LEVEL: info
      CLOTHO_LOGGING_FORMAT: json
      # 服务发现 - gRPC 地址
      CLOTHO_SERVICES_CUSTOS_ADDRESS: "custos:9001"
      CLOTHO_SERVICES_HERMES_ADDRESS: "hermes:9080"
      CLOTHO_SERVICES_KRATOS_ADDRESS: "kratos:9092"
      CLOTHO_SERVICES_PLUTUS_ADDRESS: "plutus:9085"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network

  # ========================================
  # Observability Services
  # ========================================

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: fly-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-admin-api'
    networks:
      - fly-network

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: fly-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - fly-network

networks:
  fly-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  prometheus_data:
    driver: local
