syntax = "proto3";

package custos.v1;

option go_package = "github.com/julesChu12/fly/clotho/api/proto/custos/v1;custosv1";

import "google/protobuf/timestamp.proto";

// CustosService provides user management and authentication services
service CustosService {
  // GetUser retrieves user information by user ID
  rpc GetUser(GetUserRequest) returns (GetUserResponse);

  // ValidateToken validates a JWT token and returns user information
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // UpdateUser updates user profile information
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);

  // GetUserPreferences retrieves user preferences
  rpc GetUserPreferences(GetUserPreferencesRequest) returns (GetUserPreferencesResponse);

  // UpdateUserPreferences updates user preferences
  rpc UpdateUserPreferences(UpdateUserPreferencesRequest) returns (UpdateUserPreferencesResponse);

  // GetUserStatistics retrieves user statistics and analytics
  rpc GetUserStatistics(GetUserStatisticsRequest) returns (GetUserStatisticsResponse);
}

// User represents a user entity
message User {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  string avatar = 6;
  string bio = 7;
  string phone = 8;
  string location = 9;
  string website = 10;
  UserType user_type = 11;
  int64 tenant_id = 12;
  UserStatus status = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

// UserType enum for different user types
enum UserType {
  USER_TYPE_UNSPECIFIED = 0;
  USER_TYPE_CUSTOMER = 1;
  USER_TYPE_ADMIN = 2;
  USER_TYPE_OPERATOR = 3;
}

// UserStatus enum for user account status
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_INACTIVE = 2;
  USER_STATUS_SUSPENDED = 3;
  USER_STATUS_DELETED = 4;
}

// GetUserRequest for retrieving user by ID
message GetUserRequest {
  int64 user_id = 1;
}

// GetUserResponse returns user information
message GetUserResponse {
  User user = 1;
}

// ValidateTokenRequest for token validation
message ValidateTokenRequest {
  string token = 1;
}

// ValidateTokenResponse returns user information if token is valid
message ValidateTokenResponse {
  User user = 1;
  bool is_valid = 2;
  string error_message = 3;
}

// UpdateUserRequest for updating user profile
message UpdateUserRequest {
  int64 user_id = 1;
  User user = 2;
  repeated string update_mask = 3; // Fields to update
}

// UpdateUserResponse returns updated user information
message UpdateUserResponse {
  User user = 1;
}

// GetUserPreferencesRequest for retrieving user preferences
message GetUserPreferencesRequest {
  int64 user_id = 1;
}

// GetUserPreferencesResponse returns user preferences
message GetUserPreferencesResponse {
  map<string, string> preferences = 1;
}

// UpdateUserPreferencesRequest for updating user preferences
message UpdateUserPreferencesRequest {
  int64 user_id = 1;
  map<string, string> preferences = 2;
}

// UpdateUserPreferencesResponse confirms preference update
message UpdateUserPreferencesResponse {
  map<string, string> preferences = 1;
}

// GetUserStatisticsRequest for retrieving user statistics
message GetUserStatisticsRequest {
  int64 user_id = 1;
}

// GetUserStatisticsResponse returns user statistics
message GetUserStatisticsResponse {
  map<string, int64> statistics = 1;
}