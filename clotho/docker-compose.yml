version: '3.8'

services:
  clotho:
    build:
      context: ..
      dockerfile: clotho/Dockerfile
      target: ${BUILD_TARGET:-dev}
    container_name: clotho-${APP_ENV:-dev}
    environment:
      - APP_ENV=${APP_ENV:-development}
      - SERVER_PORT=${SERVER_PORT:-8080}
      - SERVER_HOST=${SERVER_HOST:-0.0.0.0}
      - JWT_SECRET=${JWT_SECRET:-development-secret-key-change-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - CUSTOS_GRPC_ADDRESS=${CUSTOS_GRPC_ADDRESS:-custos:9001}
      - ORDERS_GRPC_ADDRESS=${ORDERS_GRPC_ADDRESS:-orders:9002}
      - PAYMENTS_GRPC_ADDRESS=${PAYMENTS_GRPC_ADDRESS:-payments:9003}
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USERNAME=${DB_USERNAME:-clotho}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=${DB_NAME:-clotho_db}
      - REDIS_ADDRESS=${REDIS_ADDRESS:-redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
    volumes:
      - go-modules:/go/pkg/mod
    ports:
      - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      - mysql
      - redis
    networks:
      - fly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${SERVER_PORT:-8080}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mysql:
    image: mysql:8.0
    container_name: clotho-mysql-${APP_ENV:-dev}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-clotho_db}
      MYSQL_USER: ${DB_USERNAME:-clotho}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: clotho-redis-${APP_ENV:-dev}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - fly-network
    restart: unless-stopped
    command: |
      sh -c 'if [ -n "${REDIS_PASSWORD}" ]; then
        redis-server --appendonly yes --requirepass ${REDIS_PASSWORD};
      else
        redis-server --appendonly yes;
      fi'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    name: clotho-mysql_data-${APP_ENV:-dev}
  redis_data:
    name: clotho-redis_data-${APP_ENV:-dev}
  go-modules:
    name: clotho-go-modules

networks:
  fly-network:
    driver: bridge
    name: fly-clotho-${APP_ENV:-dev}-network