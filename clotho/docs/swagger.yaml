definitions:
  client.AvailabilityItem:
    properties:
      day_of_week:
        type: integer
      end_time:
        type: string
      is_available:
        type: boolean
      notes:
        type: string
      start_time:
        type: string
    type: object
  client.AvailabilityRequest:
    properties:
      availabilities:
        items:
          $ref: '#/definitions/client.AvailabilityItem'
        type: array
      staff_id:
        type: string
    type: object
  client.BatchUpdateItemsRequest:
    properties:
      category_id:
        type: string
      ids:
        items:
          type: string
        type: array
      is_active:
        type: boolean
      price:
        type: number
      status:
        type: string
    type: object
  client.ConflictCheckRequest:
    properties:
      end_time:
        type: string
      exclude_id:
        type: string
      staff_id:
        type: string
      start_time:
        type: string
    type: object
  client.ConsumeRequestHTTP:
    properties:
      amount:
        type: number
      currency:
        type: string
      customer_id:
        type: integer
      idempotency_key:
        type: string
      meta:
        additionalProperties: true
        type: object
      order_id:
        type: integer
    type: object
  client.CreateAppointmentRequestHTTP:
    properties:
      customer_id:
        type: string
      end_time:
        type: string
      notes:
        type: string
      reminder:
        type: boolean
      reminder_time:
        type: string
      service_id:
        type: string
      staff_id:
        type: string
      start_time:
        type: string
    type: object
  client.CreateCategoryRequest:
    properties:
      description:
        type: string
      icon:
        type: string
      name:
        type: string
      parent_id:
        type: string
      sort_order:
        type: integer
    type: object
  client.CreateContactRequestHTTP:
    properties:
      customer_id:
        type: integer
      is_primary:
        type: boolean
      tenant_id:
        type: integer
      type:
        type: string
      value:
        type: string
    type: object
  client.CreateCustomerRequestHTTP:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      tags:
        type: string
    type: object
  client.CreateItemRequest:
    properties:
      capacity:
        type: integer
      category_id:
        type: string
      cost_price:
        type: number
      description:
        type: string
      duration:
        description: 服务字段
        type: integer
      image_url:
        type: string
      name:
        type: string
      price:
        type: number
      sku:
        type: string
      staff_required:
        type: boolean
      stock:
        description: 产品字段
        type: integer
      tags:
        type: string
      type:
        type: string
      weight:
        type: number
    type: object
  client.CreateOrderItemRequestHTTP:
    properties:
      product_id:
        type: integer
      product_name:
        type: string
      quantity:
        type: integer
      sku:
        type: string
      unit_price:
        type: number
    type: object
  client.CreateOrderRequestHTTP:
    properties:
      currency:
        type: string
      customer_id:
        type: integer
      items:
        items:
          $ref: '#/definitions/client.CreateOrderItemRequestHTTP'
        type: array
      order_no:
        type: string
      remark:
        type: string
      total_amount:
        type: number
    type: object
  client.CreateStaffRequest:
    properties:
      department:
        type: string
      email:
        type: string
      is_available:
        type: boolean
      name:
        type: string
      phone:
        type: string
      position:
        type: string
      role_id:
        type: string
      skills:
        items:
          type: string
        type: array
    type: object
  client.CreateWalletRequestHTTP:
    properties:
      currency:
        type: string
      customer_id:
        type: integer
    type: object
  client.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  client.HTTPUserInfo:
    properties:
      avatar:
        type: string
      email:
        type: string
      id:
        type: integer
      nickname:
        type: string
      role:
        type: string
      status:
        type: string
      username:
        type: string
    type: object
  client.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  client.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_expires_in:
        type: integer
      refresh_token:
        type: string
      session_id:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/client.HTTPUserInfo'
    type: object
  client.OrderStatus:
    enum:
    - pending
    - confirmed
    - processing
    - shipped
    - delivered
    - cancelled
    - refunded
    type: string
    x-enum-varnames:
    - OrderStatusPending
    - OrderStatusConfirmed
    - OrderStatusProcessing
    - OrderStatusShipped
    - OrderStatusDelivered
    - OrderStatusCancelled
    - OrderStatusRefunded
  client.PaymentChannel:
    enum:
    - wallet
    - wechat
    - alipay
    - stripe
    - paypal
    - bank
    - other
    type: string
    x-enum-varnames:
    - PaymentChannelWallet
    - PaymentChannelWeChat
    - PaymentChannelAlipay
    - PaymentChannelStripe
    - PaymentChannelPaypal
    - PaymentChannelBank
    - PaymentChannelOther
  client.RechargeRequestHTTP:
    properties:
      amount:
        type: number
      channel:
        $ref: '#/definitions/client.PaymentChannel'
      currency:
        type: string
      customer_id:
        type: integer
      idempotency_key:
        type: string
      meta:
        additionalProperties: true
        type: object
      reference_no:
        type: string
    type: object
  client.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
      session_id:
        type: string
    type: object
  client.RefundRequestHTTP:
    properties:
      amount:
        type: number
      currency:
        type: string
      customer_id:
        type: integer
      idempotency_key:
        type: string
      meta:
        additionalProperties: true
        type: object
      order_id:
        type: integer
      reference_no:
        type: string
    type: object
  client.RegisterRequest:
    properties:
      email:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  client.RegisterResponse:
    properties:
      user:
        $ref: '#/definitions/client.HTTPUserInfo'
    type: object
  client.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  client.TokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  client.UpdateAppointmentRequestHTTP:
    properties:
      customer_id:
        type: string
      end_time:
        type: string
      notes:
        type: string
      reminder:
        type: boolean
      reminder_time:
        type: string
      service_id:
        type: string
      staff_id:
        type: string
      start_time:
        type: string
      status:
        type: string
    type: object
  client.UpdateContactRequestHTTP:
    properties:
      is_primary:
        type: boolean
      type:
        type: string
      value:
        type: string
    type: object
  client.UpdateCustomerRequestHTTP:
    properties:
      email:
        type: string
      name:
        type: string
      phone:
        type: string
      tags:
        type: string
    type: object
  client.UpdateOrderStatusRequestHTTP:
    properties:
      operator_id:
        type: integer
      reason:
        type: string
      status:
        $ref: '#/definitions/client.OrderStatus'
    type: object
  client.UpdateStaffRequest:
    properties:
      department:
        type: string
      email:
        type: string
      is_available:
        type: boolean
      name:
        type: string
      phone:
        type: string
      position:
        type: string
      role_id:
        type: string
      skills:
        items:
          type: string
        type: array
    type: object
  client.UpdateStatusRequest:
    properties:
      reason:
        type: string
      status:
        type: string
    type: object
  client.UpdateStatusRequestHTTP:
    properties:
      reason:
        type: string
      status:
        type: string
    type: object
  handler.ErrorResponse:
    properties:
      error:
        example: invalid_request
        type: string
      message:
        example: The request is invalid
        type: string
      path:
        type: string
      request_id:
        type: string
      timestamp:
        type: string
    type: object
  handler.HealthResponse:
    properties:
      service:
        type: string
      status:
        type: string
      timestamp:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  handler.ProfileRequest:
    properties:
      avatar:
        type: string
      bio:
        type: string
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      location:
        type: string
      phone:
        type: string
      preferences:
        additionalProperties:
          type: string
        type: object
      username:
        type: string
      website:
        type: string
    type: object
  handler.ProfileResponse:
    properties:
      avatar:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: integer
      last_name:
        type: string
      location:
        type: string
      phone:
        type: string
      preferences:
        additionalProperties:
          type: string
        type: object
      statistics:
        additionalProperties:
          format: int64
          type: integer
        type: object
      status:
        type: string
      tenant_id:
        type: integer
      updated_at:
        type: string
      user_type:
        type: string
      username:
        type: string
      website:
        type: string
    type: object
  handler.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
      request_id:
        type: string
      success:
        type: boolean
      timestamp:
        type: string
    type: object
  handler.UserResponse:
    properties:
      email:
        type: string
      id:
        type: integer
      tenant_id:
        type: integer
      user_type:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/v1/appointments/appointments/stats:
    get:
      consumes:
      - application/json
      description: 获取预约相关的统计数据，包括总数、待确认、已完成等
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取预约统计信息
      tags:
      - appointments
  /api/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      description: 发送密码重置邮件
      parameters:
      - description: 邮箱信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
      summary: 忘记密码
      tags:
      - 认证
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 用户使用用户名和密码登录系统
      parameters:
      - description: 登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/client.LoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
      summary: 用户登录
      tags:
      - 认证
  /api/v1/auth/logout:
    post:
      description: 用户登出当前设备
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
      security:
      - ApiKeyAuth: []
      summary: 用户登出
      tags:
      - 认证
  /api/v1/auth/logout-all:
    post:
      description: 用户登出所有设备
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
      security:
      - ApiKeyAuth: []
      summary: 登出所有设备
      tags:
      - 认证
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用刷新令牌获取新的访问令牌
      parameters:
      - description: 刷新令牌信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/client.TokenResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
      summary: 刷新令牌
      tags:
      - 认证
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 新用户注册账号
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/client.RegisterResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
      summary: 用户注册
      tags:
      - 认证
  /api/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      description: 使用重置令牌设置新密码
      parameters:
      - description: 重置密码信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.SuccessResponse'
      summary: 重置密码
      tags:
      - 认证
  /api/v1/categories:
    get:
      consumes:
      - application/json
      description: 获取所有商品分类的列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: 获取分类列表
      tags:
      - 分类管理
    post:
      consumes:
      - application/json
      description: 创建新的商品分类
      parameters:
      - description: 分类信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: 创建分类
      tags:
      - 分类管理
  /api/v1/categories/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的分类
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: 删除分类
      tags:
      - 分类管理
    get:
      consumes:
      - application/json
      description: 根据ID获取单个分类的详细信息
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: 获取分类详情
      tags:
      - 分类管理
    put:
      consumes:
      - application/json
      description: 更新现有分类的信息
      parameters:
      - description: 分类ID
        in: path
        name: id
        required: true
        type: string
      - description: 分类信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: 更新分类
      tags:
      - 分类管理
  /api/v1/categories/tree:
    get:
      consumes:
      - application/json
      description: 获取层次化的分类树结构
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: 获取分类树
      tags:
      - 分类管理
  /api/v1/customers/stats:
    get:
      consumes:
      - application/json
      description: 获取客户相关的统计数据，包括总数、活跃客户、新增客户等
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: 获取客户统计信息
      tags:
      - customers
  /api/v1/items:
    get:
      consumes:
      - application/json
      description: 获取商品列表，支持分页和过滤
      parameters:
      - description: 商品类型 (SERVICE|PRODUCT)
        in: query
        name: type
        type: string
      - description: 商品状态
        in: query
        name: status
        type: string
      - description: 分类ID
        in: query
        name: category_id
        type: string
      - description: 最低价格
        in: query
        name: min_price
        type: number
      - description: 最高价格
        in: query
        name: max_price
        type: number
      - description: 搜索关键词
        in: query
        name: search
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页大小
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: 获取商品列表
      tags:
      - 商品管理
    post:
      consumes:
      - application/json
      description: 创建新的商品或服务
      parameters:
      - description: 商品信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/client.CreateItemRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: 创建商品
      tags:
      - 商品管理
  /api/v1/items/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定的商品
      parameters:
      - description: 商品ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: 删除商品
      tags:
      - 商品管理
    get:
      consumes:
      - application/json
      description: 根据ID获取单个商品的详细信息
      parameters:
      - description: 商品ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "404":
          description: Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: 获取商品详情
      tags:
      - 商品管理
    put:
      consumes:
      - application/json
      description: 更新现有商品的信息
      parameters:
      - description: 商品ID
        in: path
        name: id
        required: true
        type: string
