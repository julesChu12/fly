server:
  port: "8087"
  host: "0.0.0.0"
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s

app:
  mode: "development"

jwt:
  secret: "1HS%qUl60.,lGwd.N$"
  access_token_ttl: 15m
  refresh_token_ttl: 24h

logging:
  level: "info"
  format: "json"
  output: "stdout"

# OpenTelemetry observability configuration
observability:
  service_name: "clotho"
  exporter_url: "http://jaeger:4317"
  sample_ratio: 1.0
  environment: "development"
  exporter_type: "stdout"

  # Metrics configuration
  metrics:
    enabled: true
    prometheus:
      enabled: true
      endpoint: "/metrics"
      port: "9090"

  # Tracing configuration
  tracing:
    enabled: true
    jaeger:
      enabled: true
      endpoint: "http://jaeger:14268/api/traces"

  # Resource attributes
  resource:
    service_version: "0.1.0"
    deployment_environment: "development"

# Rate limiter configuration
rate_limiter:
  global_rps: 1000.0
  global_burst: 2000
  per_ip_rps: 10.0
  per_ip_burst: 20
  per_user_rps: 100.0
  per_user_burst: 200
  cleanup_interval: "5m"
  max_idle_time: "10m"

# Circuit breaker configuration
circuit_breaker:
  max_requests: 5
  interval: "60s"
  timeout: "30s"
  failure_threshold: 5
  failure_ratio: 0.6
  min_requests: 10

# gRPC client configurations
services:
  custos:
    grpc:
      address: "localhost:9001"
      timeout: 30s
      max_retries: 3
    http:
      address: "http://localhost:8081"
      timeout: 30s
      max_retries: 3

  orders:
    address: "localhost:9002"
    timeout: 30s
    max_retries: 3

  payments:
    address: "localhost:9003"
    timeout: 30s
    max_retries: 3

  staff:
    address: "http://localhost:8084"
    timeout: 10s
    max_retries: 3

  hermes:
    address: "http://localhost:8080"
    timeout: 30s
    max_retries: 3

  plutus:
    address: "http://localhost:8085"
    timeout: 30s
    max_retries: 3

  kratos:
    address: "http://localhost:8082"
    timeout: 30s
    max_retries: 3

  appointments:
    address: "http://localhost:8083"
    timeout: 30s
    max_retries: 3

  items:
    address: "http://localhost:8086"
    timeout: 10s
    max_retries: 3

# Database (if needed for caching or session management)
database:
  driver: "mysql"
  host: "mysql"
  port: 3306
  username: "custos"
  password: "custospassword"
  database: "clotho_db"
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 300s

# Redis cache
redis:
  address: "redis:6379"
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5