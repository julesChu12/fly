syntax = "proto3";

package order.v1;

option go_package = "github.com/julesChu12/fly/kratos/api/proto/order/v1;orderv1";

import "google/protobuf/timestamp.proto";

// OrderService provides order management operations
service OrderService {
  // CreateOrder creates a new order
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);

  // GetOrder retrieves an order by ID
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);

  // GetOrderWithItems retrieves an order with its items
  rpc GetOrderWithItems(GetOrderRequest) returns (OrderWithItemsResponse);

  // ListOrders retrieves a paginated list of orders
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);

  // UpdateOrderStatus updates the status of an order
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (OrderResponse);

  // DeleteOrder deletes an order (soft delete)
  rpc DeleteOrder(DeleteOrderRequest) returns (DeleteOrderResponse);

  // GetOrderLogs retrieves status change logs for an order
  rpc GetOrderLogs(GetOrderLogsRequest) returns (GetOrderLogsResponse);
}

// OrderStatus represents the status of an order
enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_PENDING = 1;
  ORDER_STATUS_PAID = 2;
  ORDER_STATUS_FULFILLED = 3;
  ORDER_STATUS_CANCELED = 4;
}

// Order represents an order entity
message Order {
  uint64 id = 1;
  uint64 tenant_id = 2;
  string order_no = 3;
  uint64 customer_id = 4;
  double total_amount = 5;
  string currency = 6;
  OrderStatus status = 7;
  string remark = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// OrderItem represents an order item entity
message OrderItem {
  uint64 id = 1;
  uint64 tenant_id = 2;
  uint64 order_id = 3;
  optional uint64 product_id = 4;
  string product_name = 5;
  string sku = 6;
  int32 quantity = 7;
  double unit_price = 8;
  double total_price = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// OrderStatusLog represents a status change log
message OrderStatusLog {
  uint64 id = 1;
  uint64 tenant_id = 2;
  uint64 order_id = 3;
  optional OrderStatus from_status = 4;
  OrderStatus to_status = 5;
  string reason = 6;
  optional uint64 operator_id = 7;
  google.protobuf.Timestamp created_at = 8;
}

// CreateOrderRequest represents the request to create an order
message CreateOrderRequest {
  string order_no = 1;
  uint64 customer_id = 2;
  double total_amount = 3;
  string currency = 4;
  string remark = 5;
  repeated CreateOrderItemRequest items = 6;
}

// CreateOrderItemRequest represents an order item in create request
message CreateOrderItemRequest {
  optional uint64 product_id = 1;
  string product_name = 2;
  string sku = 3;
  int32 quantity = 4;
  double unit_price = 5;
}

// GetOrderRequest represents the request to get an order
message GetOrderRequest {
  uint64 id = 1;
}

// ListOrdersRequest represents the request to list orders
message ListOrdersRequest {
  int32 page = 1;
  int32 page_size = 2;
  optional uint64 customer_id = 3;
  optional OrderStatus status = 4;
}

// UpdateOrderStatusRequest represents the request to update order status
message UpdateOrderStatusRequest {
  uint64 id = 1;
  OrderStatus status = 2;
  string reason = 3;
  optional uint64 operator_id = 4;
}

// DeleteOrderRequest represents the request to delete an order
message DeleteOrderRequest {
  uint64 id = 1;
}

// GetOrderLogsRequest represents the request to get order logs
message GetOrderLogsRequest {
  uint64 order_id = 1;
}

// OrderResponse represents the response containing an order
message OrderResponse {
  Order order = 1;
}

// OrderWithItemsResponse represents the response containing an order with items
message OrderWithItemsResponse {
  Order order = 1;
  repeated OrderItem items = 2;
}

// ListOrdersResponse represents the response containing a list of orders
message ListOrdersResponse {
  repeated Order orders = 1;
  int64 total = 2;
  int32 page = 3;
  int32 size = 4;
}

// DeleteOrderResponse represents the response for delete operation
message DeleteOrderResponse {
  bool success = 1;
  string message = 2;
}

// GetOrderLogsResponse represents the response containing order logs
message GetOrderLogsResponse {
  repeated OrderStatusLog logs = 1;
}
