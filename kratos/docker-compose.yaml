services:
  mysql:
    image: mysql:8.0
    container_name: kratos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kratos
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./configs/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fly-network

  redis:
    image: redis:7-alpine
    container_name: kratos-redis
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fly-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: kratos-jaeger
    ports:
      - "6831:6831/udp"
      - "16686:16686"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - fly-network

  kratos-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: kratos-service-dev
    ports:
      - "8082:8082"
      - "9092:9092"
    volumes:
      - .:/app
      - go-modules:/go/pkg/mod
    environment:
      - SERVER_HTTP_PORT=8082
      - SERVER_GRPC_PORT=9092
      - DATABASE_DSN=root:password@tcp(mysql:3306)/kratos?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - OBSERVABILITY_ENDPOINT=http://jaeger:4317
      - OBSERVABILITY_SERVICE_NAME=kratos
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network

  kratos-prod:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: kratos-service-prod
    ports:
      - "18082:8082"
      - "19092:9092"
    environment:
      - SERVER_HTTP_PORT=8082
      - SERVER_GRPC_PORT=9092
      - DATABASE_DSN=root:password@tcp(mysql:3306)/kratos?charset=utf8mb4&parseTime=True&loc=Local
      - REDIS_ADDR=redis:6379
      - OBSERVABILITY_ENDPOINT=http://jaeger:4317
      - OBSERVABILITY_SERVICE_NAME=kratos
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fly-network

volumes:
  mysql_data:
  go-modules:

networks:
  fly-network:
    driver: bridge
