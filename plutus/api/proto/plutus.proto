syntax = "proto3";

package plutus.v1;

option go_package = "github.com/julesChu12/fly/plutus/api/proto;plutusv1";

import "google/protobuf/timestamp.proto";

// Wallet service definition
service WalletService {
  // 创建钱包
  rpc CreateWallet(CreateWalletRequest) returns (CreateWalletResponse);
  // 获取钱包信息
  rpc GetWallet(GetWalletRequest) returns (GetWalletResponse);
  // 根据客户ID获取钱包
  rpc GetWalletByCustomerID(GetWalletByCustomerIDRequest) returns (GetWalletResponse);
  // 钱包列表
  rpc ListWallets(ListWalletsRequest) returns (ListWalletsResponse);
  // 充值
  rpc Recharge(RechargeRequest) returns (TransactionResponse);
  // 消费
  rpc Consume(ConsumeRequest) returns (TransactionResponse);
  // 退款
  rpc Refund(RefundRequest) returns (TransactionResponse);
  // 获取交易详情
  rpc GetTransaction(GetTransactionRequest) returns (TransactionResponse);
  // 交易列表
  rpc ListTransactions(ListTransactionsRequest) returns (ListTransactionsResponse);
}

// Wallet messages
message Wallet {
  uint32 id = 1;
  uint32 tenant_id = 2;
  uint32 customer_id = 3;
  double balance = 4;
  string currency = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Transaction messages
message Transaction {
  uint32 id = 1;
  uint32 tenant_id = 2;
  uint32 wallet_id = 3;
  uint32 order_id = 4;
  string type = 5;
  double amount = 6;
  string currency = 7;
  string channel = 8;
  string status = 9;
  string idempotency_key = 10;
  string reference_no = 11;
  string meta = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

// Request/Response messages for Wallet
message CreateWalletRequest {
  uint32 customer_id = 1;
  string currency = 2;
}

message CreateWalletResponse {
  Wallet wallet = 1;
}

message GetWalletRequest {
  uint32 id = 1;
}

message GetWalletByCustomerIDRequest {
  uint32 customer_id = 1;
}

message GetWalletResponse {
  Wallet wallet = 1;
}

message ListWalletsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListWalletsResponse {
  repeated Wallet wallets = 1;
  int64 total = 2;
  int32 page = 3;
  int32 size = 4;
}

// Request/Response messages for Transaction
message RechargeRequest {
  uint32 customer_id = 1;
  double amount = 2;
  string currency = 3;
  string channel = 4;
  string idempotency_key = 5;
  string reference_no = 6;
  string meta = 7;
}

message ConsumeRequest {
  uint32 customer_id = 1;
  uint32 order_id = 2;
  double amount = 3;
  string currency = 4;
  string idempotency_key = 5;
  string meta = 6;
}

message RefundRequest {
  uint32 customer_id = 1;
  uint32 order_id = 2;
  double amount = 3;
  string currency = 4;
  string idempotency_key = 5;
  string reference_no = 6;
  string meta = 7;
}

message TransactionResponse {
  Transaction transaction = 1;
}

message GetTransactionRequest {
  uint32 id = 1;
}

message ListTransactionsRequest {
  uint32 wallet_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message ListTransactionsResponse {
  repeated Transaction transactions = 1;
  int64 total = 2;
  int32 page = 3;
  int32 size = 4;
}
