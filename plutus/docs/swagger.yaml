    - consume
    - refund
    type: string
    x-enum-varnames:
    - TransactionTypeRecharge
    - TransactionTypeConsume
    - TransactionTypeRefund
  github_com_julesChu12_fly_plutus_internal_domain_entity.WalletStatus:
    enum:
