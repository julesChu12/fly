    - success
    - failed
    type: string
    x-enum-varnames:
    - TransactionStatusPending
    - TransactionStatusSuccess
    - TransactionStatusFailed
  github_com_julesChu12_fly_plutus_internal_domain_entity.TransactionType:
    enum:
