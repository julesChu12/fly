basePath: /
definitions:
  github_com_julesChu12_fly_plutus_internal_domain_entity.PaymentChannel:
    enum:
    - wallet
    - wechat
    - alipay
    - stripe
    - paypal
    - bank
    - other
    type: string
    x-enum-varnames:
    - ChannelWallet
    - ChannelWechat
    - ChannelAlipay
    - ChannelStripe
    - ChannelPaypal
    - ChannelBank
    - ChannelOther
  github_com_julesChu12_fly_plutus_internal_domain_entity.TransactionStatus:
    enum:
