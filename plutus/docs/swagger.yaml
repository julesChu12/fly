        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.Response'
