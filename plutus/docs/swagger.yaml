paths:
  /api/transactions:
    get:
      description: List transactions with pagination and filters
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: page_size
        type: integer
      - description: Wallet ID filter
        in: query
        name: wallet_id
        type: integer
      - description: Order ID filter
        in: query
        name: order_id
        type: integer
      - description: Transaction type filter
        in: query
        name: type
        type: string
      - description: Transaction status filter
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.ListResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.Response'
      summary: List transactions
      tags:
      - transactions
  /api/transactions/{id}:
    get:
      description: Get transaction by ID
      parameters:
      - description: Transaction ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.TransactionResponse'
