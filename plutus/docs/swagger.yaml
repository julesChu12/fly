    - frozen
    type: string
    x-enum-varnames:
    - WalletStatusActive
    - WalletStatusFrozen
  github_com_julesChu12_fly_plutus_pkg_types.ConsumeRequest:
    properties:
      amount:
        minimum: 0.01
        type: number
      currency:
        type: string
      customer_id:
        type: integer
      idempotency_key:
        type: string
      meta:
        additionalProperties: true
        type: object
      order_id:
        type: integer
    required:
    - amount
    - customer_id
    type: object
  github_com_julesChu12_fly_plutus_pkg_types.CreateWalletRequest:
    properties:
      currency:
        type: string
      customer_id:
        type: integer
    required:
    - customer_id
    type: object
  github_com_julesChu12_fly_plutus_pkg_types.ListResponse:
    properties:
