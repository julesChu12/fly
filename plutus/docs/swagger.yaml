      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.Response'
            - properties:
                data:
                  $ref: '#/definitions/github_com_julesChu12_fly_plutus_pkg_types.TransactionResponse'
