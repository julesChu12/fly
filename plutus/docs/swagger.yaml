      meta:
        additionalProperties: true
        type: object
      reference_no:
        type: string
    required:
    - amount
    - channel
    - customer_id
    type: object
  github_com_julesChu12_fly_plutus_pkg_types.RefundRequest:
    properties:
      amount:
        minimum: 0.01
        type: number
      currency:
        type: string
      customer_id:
        type: integer
      idempotency_key:
        type: string
      meta:
        additionalProperties: true
        type: object
      order_id:
        type: integer
      reference_no:
        type: string
    required:
