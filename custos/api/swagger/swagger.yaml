basePath: /api/v1
definitions:
  auth.ChangePasswordRequest:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    required:
    - current_password
    - new_password
    type: object
  auth.PasswordPolicyResponse:
    properties:
      forbid_common_passwords:
        type: boolean
      max_repeating_chars:
        type: integer
      min_length:
        type: integer
      require_lowercase:
        type: boolean
      require_numbers:
        type: boolean
      require_special_chars:
        type: boolean
      require_uppercase:
        type: boolean
    type: object
  auth.ValidatePasswordRequest:
    properties:
      password:
        type: string
    required:
    - password
    type: object
  auth.ValidatePasswordResponse:
    properties:
      errors:
        items:
          type: string
        type: array
      is_valid:
        type: boolean
      score:
        type: integer
      strength_message:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      code:
        type: string
      fields:
        additionalProperties: true
        type: object
      message:
        type: string
    type: object
  dto.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
      session_id:
        type: string
    required:
    - refresh_token
    - session_id
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  dto.SuccessResponse:
    properties:
      data: {}
    type: object
  handler.HealthResponse:
    properties:
      service:
        example: custos-user-service
        type: string
      status:
        example: healthy
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
host: localhost:8081
info:
  contact:
    email: support@fly.com
    name: API Support
    url: http://www.fly.com/support
  description: 用户认证和授权服务API文档，提供用户注册、登录、OAuth、RBAC等功能
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Custos User & Authentication Service API
  version: "1.0"
paths:
  /api/v1/admin/users/{user_id}/password/check:
    post:
      consumes:
      - application/json
      description: Checks the password strength for a specific user (admin access
        required)
      parameters:
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: Password to check
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ValidatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ValidatePasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Check password strength for user
      tags:
      - password
  /api/v1/password/change:
    post:
      consumes:
      - application/json
      description: Changes the authenticated user's password
      parameters:
      - description: Password change details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change user password
      tags:
      - password
  /api/v1/password/policy:
    get:
      description: Returns the current password security policy
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PasswordPolicyResponse'
      summary: Get password policy
      tags:
      - password
  /api/v1/password/validate:
    post:
      consumes:
      - application/json
      description: Validates a password against the current security policy
      parameters:
      - description: Password to validate
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ValidatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.ValidatePasswordResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Validate password strength
      tags:
      - password
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名/邮箱和密码登录
      parameters:
      - description: 登录凭证
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 用户登录
      tags:
      - 认证
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用刷新令牌获取新的访问令牌
      parameters:
      - description: 刷新令牌
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 刷新访问令牌
      tags:
      - 认证
  /auth/register:
    post:
      consumes:
      - application/json
      description: 创建新用户账户
      parameters:
      - description: 注册信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: 用户注册
      tags:
      - 认证
  /health:
    get:
      description: 检查服务健康状态
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthResponse'
      summary: 健康检查
      tags:
      - 健康检查
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: 用户认证相关接口（注册、登录、刷新令牌等）
  name: 认证
- description: OAuth 第三方登录相关接口
  name: OAuth
- description: 用户信息管理相关接口
  name: 用户
- description: 用户个人配置管理接口
  name: 用户配置
- description: 管理员功能相关接口（需要管理员权限）
  name: 管理员
- description: 服务健康检查接口
  name: 健康检查
