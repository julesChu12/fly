app:
  port: "8081"
  env: "development"

database:
  host: "custos-mysql"
  port: "3306"
  user: "custos"
  password: "custospassword"
  database: "custos"
  charset: "utf8mb4"

jwt:
  secretKey: "1HS%qUl60.,lGwd.N$"
  accessTokenTTL: "150m"
  refreshTokenTTL: "168h"

log:
  level: "info"              # debug, info, warn, error
  format: "json"             # json, console (console for dev, json for production)
  outputPath: "logs/custos.log"  # log file path
  maxSize: 100               # megabytes - max size before rotation
  maxBackups: 7              # number of old log files to retain
  maxAge: 30                 # days - max age of old log files
  compress: true             # compress old log files
  enableStdout: true         # output to stdout (for k8s log collectors)
  enableFile: true           # output to file (for persistent storage)

oauth:
  state_key: "VZL54s27JH%jeX;Y+;"
  state_ttl: 600  # 10 minutes in seconds

  google:
    client_id: ""
    client_secret: ""
    redirect_url: ""
    scopes: ["openid", "email", "profile"]
    auth_url: "https://accounts.google.com/o/oauth2/auth"
    token_url: "https://oauth2.googleapis.com/token"
    user_info_url: "https://www.googleapis.com/oauth2/v2/userinfo"

  github:
    client_id: ""
    client_secret: ""
    redirect_url: ""
    scopes: ["user:email"]
    auth_url: "https://github.com/login/oauth/authorize"
    token_url: "https://github.com/login/oauth/access_token"
    user_info_url: "https://api.github.com/user"
