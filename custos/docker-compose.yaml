services:
  mysql:
    image: mysql:8.0
    container_name: custos-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: custos
      MYSQL_USER: custos
      MYSQL_PASSWORD: custospassword
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    restart: always

  redis:
    image: redis:6-alpine
    container_name: custos-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: always

  custos:
    build: .
    container_name: custos-app
    depends_on:
      - mysql
      - redis
    ports:
      - "8081:8081"
    volumes:
      - ./configs:/app/configs
    environment:
      CONFIG_PATH: /app/configs/custos.yaml