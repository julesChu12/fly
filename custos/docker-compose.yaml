services:
  mysql:
    image: mysql:8.0
    container_name: custos-mysql
    # 声明内部端口，只在容器网络内访问
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: custos
      MYSQL_USER: custos
      MYSQL_PASSWORD: custospassword
      MYSQL_ROOT_HOST: "%"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/my.cnf
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s
    networks:
      - fly-network

  redis:
    image: redis:6-alpine
    container_name: custos-redis
    # 声明内部端口，只在容器网络内访问
    expose:
      - "6379"
    volumes:
      - ./redis/data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    restart: always
    networks:
      - fly-network


  custos-dev:
    build:
      context: ..  # 使用父目录作为上下文,以便访问 mora
      dockerfile: custos/Dockerfile.dev
    ports:
      - "8081:8081"
    volumes:
      - .:/app
      - ../mora:/mora  # 挂载 mora 以支持热更新
      - go-modules:/go/pkg/mod
    environment:
      - GIN_MODE=debug
      - GO_ENV=development
    command: ["air"]
    networks:
      - fly-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # custos-prod:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.prod
  #   ports:
  #     - "8881:8881"
  #   environment:
  #     - GIN_MODE=release
  #     - GO_ENV=production
  #   networks:
  #     - fly-network
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     redis:
  #       condition: service_started
volumes:
  go-modules:

networks:
  fly-network:
    driver: bridge