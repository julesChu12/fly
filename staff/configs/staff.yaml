# Staff Service Configuration

server:
  http_port: 8089
  grpc_port: 9086

database:
  driver: mysql
  host: mysql
  port: "3306"
  username: staff
  password: staffpassword
  database: staff
  charset: utf8mb4
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 3600
  log_level: warn

logger:
  level: info
  format: json
  enable_stdout: true
  enable_file: false
