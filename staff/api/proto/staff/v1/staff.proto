syntax = "proto3";

package staff.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/struct.proto";

option go_package = "github.com/julesChu12/fly/staff/api/proto/staff/v1;staffv1";

// StaffService provides staff management operations
service StaffService {
  // Staff CRUD operations
  rpc CreateStaff(CreateStaffRequest) returns (CreateStaffResponse);
  rpc GetStaff(GetStaffRequest) returns (GetStaffResponse);
  rpc ListStaff(ListStaffRequest) returns (ListStaffResponse);
  rpc UpdateStaff(UpdateStaffRequest) returns (UpdateStaffResponse);
  rpc DeleteStaff(DeleteStaffRequest) returns (DeleteStaffResponse);

  // Staff status operations
  rpc UpdateStaffStatus(UpdateStaffStatusRequest) returns (UpdateStaffStatusResponse);
  rpc GetAvailableStaff(GetAvailableStaffRequest) returns (GetAvailableStaffResponse);

  // Role management
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
  rpc GetRole(GetRoleRequest) returns (GetRoleResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);

  // Availability management
  rpc GetAvailability(GetAvailabilityRequest) returns (GetAvailabilityResponse);
  rpc SetAvailability(SetAvailabilityRequest) returns (SetAvailabilityResponse);
  rpc GetStaffAvailability(GetStaffAvailabilityRequest) returns (GetStaffAvailabilityResponse);
}

// Staff message represents a staff member
message Staff {
  string id = 1;
  google.protobuf.StringValue user_id = 2;
  string name = 3;
  string email = 4;
  string phone = 5;
  string gender = 6;
  google.protobuf.StringValue birthday = 7;
  google.protobuf.StringValue avatar = 8;
  string department = 9;
  string position = 10;
  string role_id = 11;
  string status = 12;
  google.protobuf.StringValue hire_date = 13;
  google.protobuf.DoubleValue salary = 14;
  google.protobuf.StringValue address = 15;
  google.protobuf.StringValue emergency_contact = 16;
  google.protobuf.StringValue notes = 17;
  repeated string skills = 18;
  google.protobuf.Value working_hours = 19; // JSON object for flexible working hours
  bool is_available = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
}

// StaffRole represents a staff role
message StaffRole {
  string id = 1;
  string name = 2;
  string code = 3;
  google.protobuf.StringValue description = 4;
  repeated string permissions = 5;
  bool is_default = 6;
  int32 sort_order = 7;
  string status = 8;
  int32 staff_count = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// StaffAvailability represents staff availability
message StaffAvailability {
  string id = 1;
  string staff_id = 2;
  int32 day_of_week = 3; // 0 = Sunday, 1 = Monday, ..., 6 = Saturday
  string start_time = 4; // HH:MM format
  string end_time = 5;   // HH:MM format
  bool is_available = 6;
  google.protobuf.StringValue notes = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

// AvailabilityItem represents an availability setting item
message AvailabilityItem {
  int32 day_of_week = 1;
  string start_time = 2;
  string end_time = 3;
  bool is_available = 4;
  google.protobuf.StringValue notes = 5;
}

// Request/Response messages for Staff CRUD

message CreateStaffRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  string gender = 4;
  google.protobuf.StringValue birthday = 5;
  google.protobuf.StringValue avatar = 6;
  string department = 7;
  string position = 8;
  string role_id = 9;
  string status = 10;
  google.protobuf.StringValue hire_date = 11;
  google.protobuf.DoubleValue salary = 12;
  google.protobuf.StringValue address = 13;
  google.protobuf.StringValue emergency_contact = 14;
  google.protobuf.StringValue notes = 15;
  repeated string skills = 16;
  google.protobuf.Value working_hours = 17;
  bool is_available = 18;
}

message CreateStaffResponse {
  Staff staff = 1;
}

message GetStaffRequest {
  string id = 1;
}

message GetStaffResponse {
  Staff staff = 1;
}

message ListStaffRequest {
  google.protobuf.StringValue search = 1;
  google.protobuf.StringValue department = 2;
  google.protobuf.StringValue role_id = 3;
  google.protobuf.StringValue status = 4;
  google.protobuf.BoolValue is_available = 5;
  google.protobuf.Int32Value min_age = 6;
  google.protobuf.Int32Value max_age = 7;
  google.protobuf.StringValue gender = 8;
  repeated string skills = 9;
  int32 page = 10;
  int32 page_size = 11;
  string sort = 12;
  string order = 13;
}

message ListStaffResponse {
  repeated Staff staff = 1;
  int64 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message UpdateStaffRequest {
  string id = 1;
  google.protobuf.StringValue name = 2;
  google.protobuf.StringValue email = 3;
  google.protobuf.StringValue phone = 4;
  google.protobuf.StringValue gender = 5;
  google.protobuf.StringValue birthday = 6;
  google.protobuf.StringValue avatar = 7;
  google.protobuf.StringValue department = 8;
  google.protobuf.StringValue position = 9;
  google.protobuf.StringValue role_id = 10;
  google.protobuf.StringValue status = 11;
  google.protobuf.StringValue hire_date = 12;
  google.protobuf.DoubleValue salary = 13;
  google.protobuf.StringValue address = 14;
  google.protobuf.StringValue emergency_contact = 15;
  google.protobuf.StringValue notes = 16;
  repeated string skills = 17;
  google.protobuf.Value working_hours = 18;
  google.protobuf.BoolValue is_available = 19;
}

message UpdateStaffResponse {
  Staff staff = 1;
}

message DeleteStaffRequest {
  string id = 1;
}

message DeleteStaffResponse {
}

// Status management messages

message UpdateStaffStatusRequest {
  string id = 1;
  string status = 2;
  google.protobuf.StringValue reason = 3;
}

message UpdateStaffStatusResponse {
  Staff staff = 1;
}

message GetAvailableStaffRequest {
  google.protobuf.StringValue department = 1;
  repeated string skills = 2;
  google.protobuf.StringValue time_slot = 3; // Optional time slot filter
}

message GetAvailableStaffResponse {
  repeated Staff staff = 1;
}

// Role management messages

message ListRolesRequest {
  google.protobuf.StringValue status = 1;
  string sort = 2;
  string order = 3;
}

message ListRolesResponse {
  repeated StaffRole roles = 1;
}

message CreateRoleRequest {
  string name = 1;
  string code = 2;
  google.protobuf.StringValue description = 3;
  repeated string permissions = 4;
  bool is_default = 5;
  int32 sort_order = 6;
  string status = 7;
}

message CreateRoleResponse {
  StaffRole role = 1;
}

message GetRoleRequest {
  string id = 1;
}

message GetRoleResponse {
  StaffRole role = 1;
}

message UpdateRoleRequest {
  string id = 1;
  google.protobuf.StringValue name = 2;
  google.protobuf.StringValue code = 3;
  google.protobuf.StringValue description = 4;
  repeated string permissions = 5;
  google.protobuf.BoolValue is_default = 6;
  google.protobuf.Int32Value sort_order = 7;
  google.protobuf.StringValue status = 8;
}

message UpdateRoleResponse {
  StaffRole role = 1;
}

message DeleteRoleRequest {
  string id = 1;
}

message DeleteRoleResponse {
}

// Availability management messages

message GetAvailabilityRequest {
  string staff_id = 1;
}

message GetAvailabilityResponse {
  repeated StaffAvailability availabilities = 1;
}

message SetAvailabilityRequest {
  string staff_id = 1;
  repeated AvailabilityItem availabilities = 2;
}

message SetAvailabilityResponse {
  repeated StaffAvailability availabilities = 1;
}

message GetStaffAvailabilityRequest {
  string staff_id = 1;
  int32 day_of_week = 2; // Optional: get availability for specific day
}

message GetStaffAvailabilityResponse {
  repeated StaffAvailability availabilities = 1;
}