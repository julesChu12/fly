services:
  mysql:
    image: mysql:latest
    container_name: fly-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: custos
      MYSQL_USER: custos
      MYSQL_PASSWORD: custospassword
      MYSQL_ROOT_HOST: "%"
    volumes:
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 30s
    networks:
      - fly-network

  redis:
    image: redis:6-alpine
    container_name: fly-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./custos/redis/data:/data
      - ./custos/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fly-network

  custos:
    build:
      context: .
      dockerfile: custos/Dockerfile.prod
    container_name: custos-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8081:8081"
      - "9001:9001"
    volumes:
      - ./custos/configs:/app/configs
    environment:
      CONFIG_PATH: /app/configs/custos.yaml
      SERVER_HTTP_PORT: "8081"
      SERVER_GRPC_PORT: "9001"
      DATABASE_DSN: custos:custospassword@tcp(mysql:3306)/custos?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network

  clotho:
    build:
      context: .
      dockerfile: clotho/Dockerfile.prod
    container_name: clotho-app
    depends_on:
      custos:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./clotho/configs:/app/configs
    environment:
      CONFIG_PATH: /app/configs/clotho.yaml
      SERVER_PORT: "8080"
      SERVER_HOST: "0.0.0.0"
      JWT_SECRET: "production-secret-key-change-this"
      LOG_LEVEL: "info"
      LOG_FORMAT: "json"
      # 服务发现配置 (与代码读取一致的 *_GRPC_ADDRESS 键名)
      CUSTOS_GRPC_ADDRESS: "custos:9001"
      HERMES_GRPC_ADDRESS: "hermes:9080"
      KRATOS_GRPC_ADDRESS: "kratos:9092"
      PLUTUS_GRPC_ADDRESS: "plutus:9085"
    networks:
      - fly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: fly-jaeger
    restart: always
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - fly-network

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: fly-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - fly-network
  hermes:
    build:
      context: .
      dockerfile: hermes/Dockerfile.prod
    container_name: hermes-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8082:8080"
      - "9080:9080"
    volumes:
      - ./hermes/configs:/app/configs
    environment:
      DATABASE_URL: hermes:hermespassword@tcp(mysql:3306)/hermes?charset=utf8mb4&parseTime=True&loc=Local
      PORT: "8080"
      GRPC_PORT: "9080"
      REDIS_URL: redis:6379
      OBSERVABILITY_ENDPOINT: http://jaeger:4317
      OBSERVABILITY_SERVICE_NAME: hermes
    networks:
      - fly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  kratos:
    build:
      context: .
      dockerfile: kratos/Dockerfile.prod
    container_name: kratos-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8084:8082"
      - "9092:9092"
    volumes:
      - ./kratos/configs:/app/configs
    environment:
      SERVER_HTTP_PORT: "8082"
      SERVER_GRPC_PORT: "9092"
      DATABASE_DSN: kratos:kratospassword@tcp(mysql:3306)/kratos?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      CUSTOS_GRPC_ADDRESS: custos:9001
      OBSERVABILITY_ENDPOINT: http://jaeger:4317
      OBSERVABILITY_SERVICE_NAME: kratos
    networks:
      - fly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  plutus:
    build:
      context: .
      dockerfile: plutus/Dockerfile.prod
    container_name: plutus-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8085:8085"
      - "9085:9085"
    volumes:
      - ./plutus/configs:/app/configs
    environment:
      SERVER_HTTP_PORT: "8085"
      SERVER_GRPC_PORT: "9085"
      DATABASE_DSN: plutus:plutuspassword@tcp(mysql:3306)/plutus?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      OBSERVABILITY_ENDPOINT: http://jaeger:4317
      OBSERVABILITY_SERVICE_NAME: plutus
    networks:
      - fly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  appointments:
    build:
      context: .
      dockerfile: appointments/Dockerfile.prod
    container_name: appointments-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "18083:18083"
      - "15083:15083"
    volumes:
      - ./appointments/configs:/app/configs
    environment:
      SERVER_HTTP_PORT: "18083"
      SERVER_GRPC_PORT: "15083"
      DATABASE_DSN: appointments:appointmentspassword@tcp(mysql:3306)/appointments?charset=utf8mb4&parseTime=True&loc=Local
      REDIS_ADDR: redis:6379
      CUSTOS_GRPC_ADDRESS: custos:9001
      KRATOS_GRPC_ADDRESS: kratos:9092
      PLUTUS_GRPC_ADDRESS: plutus:9085
      STAFF_GRPC_ADDRESS: staff:9090
      OBSERVABILITY_ENDPOINT: http://jaeger:4317
      OBSERVABILITY_SERVICE_NAME: appointments
    networks:
      - fly-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:18083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  fly-network:
    driver: bridge
