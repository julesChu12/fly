networks:
  fly-network:
    driver: bridge
    name: fly-network

services:
  mysql:
    image: mysql:8.0
    container_name: fly-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${COMMON_DB_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${COMMON_DB_PORT:-3306}:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fly-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fly-redis
    ports:
      - "${COMMON_REDIS_PORT:-6379}:6379"
    command: |
      sh -c 'if [ -n "${COMMON_REDIS_PASSWORD}" ]; then
        redis-server --requirepass ${COMMON_REDIS_PASSWORD};
      else
        redis-server;
      fi'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fly-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: fly-jaeger
    ports:
      - "${COMMON_JAEGER_PORT_UI:-16686}:16686"
      - "${COMMON_JAEGER_PORT_OTLP:-4317}:4317"
      - "${COMMON_JAEGER_PORT_OTLP_HTTP:-4322}:4318"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:14269/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - fly-network
    restart: unless-stopped

  items:
    build:
      context: .
      dockerfile: items/Dockerfile
      target: ${BUILD_TARGET:-dev}
      args:
        GO_VERSION: ${GO_VERSION:-1.25.1}
        BUILD_OS: ${BUILD_OS:-linux}
        BUILD_ARCH: ${BUILD_ARCH:-amd64}
    container_name: items
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${ITEMS_SERVER_PORT:-8086}:8086"
      - "${ITEMS_GRPC_PORT:-50056}:50056"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=${COMMON_DB_HOST}
      - DB_PORT=${COMMON_DB_PORT}
      - DB_USERNAME=${ITEMS_DB_USERNAME}
      - DB_PASSWORD=${ITEMS_DB_PASSWORD}
      - DB_NAME=${ITEMS_DB_NAME}
      - REDIS_ADDRESS=${COMMON_REDIS_HOST}:${COMMON_REDIS_PORT}
      - REDIS_PASSWORD=${COMMON_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network
    restart: unless-stopped

  appointments:
    build:
      context: .
      dockerfile: appointments/Dockerfile
      target: ${BUILD_TARGET:-dev}
      args:
        GO_VERSION: ${GO_VERSION:-1.25.1}
        BUILD_OS: ${BUILD_OS:-linux}
        BUILD_ARCH: ${BUILD_ARCH:-amd64}
    container_name: appointments
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${APPOINTMENTS_SERVER_HTTP_PORT:-8083}:8083"
      - "${APPOINTMENTS_SERVER_GRPC_PORT:-9083}:9083"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=${COMMON_DB_HOST}
      - DB_PORT=${COMMON_DB_PORT}
      - DB_USERNAME=${APPOINTMENTS_DB_USERNAME}
      - DB_PASSWORD=${APPOINTMENTS_DB_PASSWORD}
      - DB_NAME=${APPOINTMENTS_DB_NAME}
      - REDIS_HOST=${COMMON_REDIS_HOST}
      - REDIS_PORT=${COMMON_REDIS_PORT}
      - REDIS_PASSWORD=${COMMON_REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18083/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network
    restart: unless-stopped

  clotho:
    build:
      context: .
      dockerfile: clotho/Dockerfile
      target: ${BUILD_TARGET:-dev}
      args:
        GO_VERSION: ${GO_VERSION:-1.25.1}
        BUILD_OS: ${BUILD_OS:-linux}
        BUILD_ARCH: ${BUILD_ARCH:-amd64}
    container_name: clotho
    depends_on:
      custos:
        condition: service_started
      plutus:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${CLOTHO_SERVER_PORT:-8087}:8087"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=${COMMON_DB_HOST}
      - DB_PORT=${COMMON_DB_PORT}
      - DB_USERNAME=${CLOTHO_DB_USERNAME}
      - DB_PASSWORD=${CLOTHO_DB_PASSWORD}
      - DB_NAME=${CLOTHO_DB_NAME}
      - REDIS_ADDRESS=${COMMON_REDIS_HOST}:${COMMON_REDIS_PORT}
      - REDIS_PASSWORD=${COMMON_REDIS_PASSWORD}
      - CUSTOS_GRPC_ADDRESS=custos:${CUSTOS_APP_PORT_GRPC}
      - PLUTUS_GRPC_ADDRESS=plutus:${PLUTUS_SERVER_GRPC_PORT}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network
    restart: unless-stopped

  custos:
    build:
      context: .
      dockerfile: custos/Dockerfile
      target: ${BUILD_TARGET:-dev}
      args:
        GO_VERSION: ${GO_VERSION:-1.25.1}
        BUILD_OS: ${BUILD_OS:-linux}
        BUILD_ARCH: ${BUILD_ARCH:-amd64}
    container_name: custos
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${CUSTOS_APP_PORT_HTTP:-8082}:8082"
      - "${CUSTOS_APP_PORT_GRPC:-9001}:9001"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DB_HOST=${COMMON_DB_HOST}
      - DB_PORT=${COMMON_DB_PORT}
      - DB_USER=${CUSTOS_DB_USER}
      - DB_PASSWORD=${CUSTOS_DB_PASSWORD}
      - DB_DATABASE=${CUSTOS_DB_DATABASE}
      - REDIS_HOST=${COMMON_REDIS_HOST}
      - REDIS_PORT=${COMMON_REDIS_PORT}
      - REDIS_PASSWORD=${COMMON_REDIS_PASSWORD}
      - JWT_SECRET=${CUSTOS_JWT_SECRET}
      - OAUTH_STATE_KEY=${CUSTOS_OAUTH_STATE_KEY}
    command: ["air"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network
    restart: unless-stopped

  hermes:
    build:
      context: .
      dockerfile: hermes/Dockerfile
      target: ${BUILD_TARGET:-dev}
      args:
        GO_VERSION: ${GO_VERSION:-1.25.1}
        BUILD_OS: ${BUILD_OS:-linux}
        BUILD_ARCH: ${BUILD_ARCH:-amd64}
    container_name: hermes
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "${HERMES_SERVER_HTTP_PORT:-8081}:8081"
      - "${HERMES_SERVER_GRPC_PORT:-9081}:9081"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - HERMES_SERVER_HTTP_PORT=${HERMES_SERVER_HTTP_PORT}
      - HERMES_SERVER_GRPC_PORT=${HERMES_SERVER_GRPC_PORT}
      - HERMES_DATABASE_HOST=${COMMON_DB_HOST}
      - HERMES_DATABASE_PORT=${COMMON_DB_PORT}
      - HERMES_DATABASE_USERNAME=${HERMES_DB_USERNAME}
      - HERMES_DATABASE_PASSWORD=${HERMES_DB_PASSWORD}
      - HERMES_DATABASE_DATABASE=${HERMES_DB_NAME}
      - HERMES_REDIS_URL=${COMMON_REDIS_HOST}:${COMMON_REDIS_PORT}
      - HERMES_REDIS_PASSWORD=${COMMON_REDIS_PASSWORD}
      - HERMES_OBSERVABILITY_ENDPOINT=http://jaeger:${COMMON_JAEGER_PORT_OTLP}
      - HERMES_OBSERVABILITY_SERVICE_NAME=hermes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network
    restart: unless-stopped

  kratos:
    build:
      context: .
      dockerfile: kratos/Dockerfile
      target: ${BUILD_TARGET:-dev}
      args:
        GO_VERSION: ${GO_VERSION:-1.25.1}
        BUILD_OS: ${BUILD_OS:-linux}
        BUILD_ARCH: ${BUILD_ARCH:-amd64}
    container_name: kratos
    depends_on:
      custos:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "${KRATOS_SERVER_HTTP_PORT:-8088}:8088"
      - "${KRATOS_SERVER_GRPC_PORT:-9092}:9092"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - KRATOS_SERVER_HTTP_PORT=${KRATOS_SERVER_HTTP_PORT}
      - KRATOS_SERVER_GRPC_PORT=${KRATOS_SERVER_GRPC_PORT}
      - KRATOS_DATABASE_DSN=${KRATOS_DB_USERNAME}:${KRATOS_DB_PASSWORD}@tcp(${COMMON_DB_HOST}:${COMMON_DB_PORT})/${KRATOS_DB_NAME}?charset=utf8mb4&parseTime=True&loc=Local
      - KRATOS_REDIS_ADDR=${COMMON_REDIS_HOST}:${COMMON_REDIS_PORT}
      - KRATOS_REDIS_PASSWORD=${COMMON_REDIS_PASSWORD}
      - KRATOS_OBSERVABILITY_ENDPOINT=http://jaeger:${COMMON_JAEGER_PORT_OTLP}
      - KRATOS_OBSERVABILITY_SERVICE_NAME=kratos
      - KRATOS_CUSTOS_GRPC_ADDRESS=custos:${CUSTOS_APP_PORT_GRPC}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network
    restart: unless-stopped

  plutus:
    build:
      context: .
      dockerfile: plutus/Dockerfile
      target: ${BUILD_TARGET:-dev}
      args:
        GO_VERSION: ${GO_VERSION:-1.25.1}
        BUILD_OS: ${BUILD_OS:-linux}
        BUILD_ARCH: ${BUILD_ARCH:-amd64}
    container_name: plutus
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      jaeger:
        condition: service_started
    ports:
      - "${PLUTUS_SERVER_HTTP_PORT:-8085}:8085"
      - "${PLUTUS_SERVER_GRPC_PORT:-9085}:9085"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - PLUTUS_SERVER_HTTP_PORT=${PLUTUS_SERVER_HTTP_PORT}
      - PLUTUS_SERVER_GRPC_PORT=${PLUTUS_SERVER_GRPC_PORT}
      - PLUTUS_DATABASE_DSN=${PLUTUS_DB_USERNAME}:${PLUTUS_DB_PASSWORD}@tcp(${COMMON_DB_HOST}:${COMMON_DB_PORT})/${PLUTUS_DB_NAME}?charset=utf8mb4&parseTime=True&loc=Local
      - PLUTUS_REDIS_ADDR=${COMMON_REDIS_HOST}:${COMMON_REDIS_PORT}
      - PLUTUS_REDIS_PASSWORD=${COMMON_REDIS_PASSWORD}
      - PLUTUS_OBSERVABILITY_ENDPOINT=http://jaeger:${COMMON_JAEGER_PORT_OTLP}
      - PLUTUS_OBSERVABILITY_SERVICE_NAME=plutus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network
    restart: unless-stopped

  staff:
    build:
      context: .
      dockerfile: staff/Dockerfile
      target: ${BUILD_TARGET:-dev}
      args:
        GO_VERSION: ${GO_VERSION:-1.25.1}
        BUILD_OS: ${BUILD_OS:-linux}
        BUILD_ARCH: ${BUILD_ARCH:-amd64}
    container_name: staff
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${STAFF_SERVER_HTTP_PORT:-8089}:8089"
      - "${STAFF_SERVER_GRPC_PORT:-9086}:9086"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - STAFF_SERVER_HTTP_PORT=${STAFF_SERVER_HTTP_PORT}
      - STAFF_SERVER_GRPC_PORT=${STAFF_SERVER_GRPC_PORT}
      - STAFF_DATABASE_HOST=${COMMON_DB_HOST}
      - STAFF_DATABASE_PORT=${COMMON_DB_PORT}
      - STAFF_DATABASE_USER=${STAFF_DB_USERNAME}
      - STAFF_DATABASE_PASSWORD=${STAFF_DB_PASSWORD}
      - STAFF_DATABASE_NAME=${STAFF_DB_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fly-network
    restart: unless-stopped

  